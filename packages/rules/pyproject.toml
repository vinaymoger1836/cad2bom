[project]
name = "c2b-rules"
version = "0.0.0"
description = "Deterministic rules engine (no LLM imports, ever; CLAUDE.md rule 1)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "c2b-domain",
  "c2b-library",
  "pyyaml>=6",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c2b_rules"]

[tool.mypy]
python_version = "3.12"
platform = "linux"  # the code runs in Linux containers
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
