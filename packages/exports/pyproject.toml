[project]
name = "c2b-exports"
version = "0.0.0"
description = "BoM exports: XLSX workbook, CSV, JSON (+ schema) and PDF parts list from a frozen BomVersion"
requires-python = ">=3.12,<3.13"
dependencies = [
  "c2b-domain",
  "openpyxl>=3.1",
  "weasyprint>=63",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c2b_exports"]

[tool.mypy]
python_version = "3.12"
platform = "linux"  # the code runs in Linux containers
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "weasyprint", "weasyprint.*"]
ignore_missing_imports = true  # no type stubs shipped
