[project]
name = "c2b-agents"
version = "0.0.0"
description = "LLM router, fallback ladder L1-L6, LangGraph agent, cassettes (docs/02 §4, docs/04 §9)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "c2b-domain",
  "c2b-library",
  "c2b-rules",
  "c2b-jobs",
  "litellm>=1.63.0",
  "langgraph>=0.3.0",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c2b_agents"]

[tool.mypy]
python_version = "3.12"
platform = "linux"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
