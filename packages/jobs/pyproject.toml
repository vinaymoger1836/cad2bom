[project]
name = "c2b-jobs"
version = "0.0.0"
description = "Shared job plumbing: settings, database, migrations, procrastinate app, queue names (ADR-011)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "c2b-domain",
  "psycopg[binary,pool]>=3.2",
  "procrastinate>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c2b_jobs"]

[project.scripts]
c2b-migrate = "c2b_jobs.migrate:main"

[tool.mypy]
python_version = "3.12"
platform = "linux"  # the code runs in Linux containers
mypy_path = "src"
