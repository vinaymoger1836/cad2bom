[project]
name = "c2b-library"
version = "0.0.0"
description = "Library loader, validation, Postgres load and search for library/ YAML (docs/06)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "c2b-domain",
  "c2b-jobs",
  "pydantic>=2.9,<3",
  "pyyaml>=6",
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c2b_library"]

[project.scripts]
c2b-library = "c2b_library.cli:main"

[tool.mypy]
python_version = "3.12"
platform = "linux"  # the code runs in Linux containers
mypy_path = "src"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true
