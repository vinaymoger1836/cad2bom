[project]
name = "c2b-domain"
version = "0.0.0"
description = "CAD-to-BoM domain models: Prov, job and upload API shapes"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c2b_domain"]

[project.scripts]
c2b-export-schema = "c2b_domain.export_schema:main"

[tool.mypy]
python_version = "3.12"
platform = "linux"  # the code runs in Linux containers
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
