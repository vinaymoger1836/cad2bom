[project]
name = "c2b-worker"
version = "0.0.0"
description = "Pipeline step runner (procrastinate queues: pipeline, cad)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "c2b-domain",
  "c2b-jobs",
  "c2b-rules",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c2b_worker"]

[project.scripts]
c2b-worker = "c2b_worker.main:main"

[tool.mypy]
python_version = "3.12"
platform = "linux"  # the code runs in Linux containers
mypy_path = "src"
