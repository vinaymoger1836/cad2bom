[project]
name = "c2b-native-adapter"
version = "0.0.0"
description = "Native CAD adapter: interface, APS converter, record/replay transport (ADR-004, ADR-018)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "c2b-domain",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_configs = true
