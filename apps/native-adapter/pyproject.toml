[project]
name = "c2b-native-adapter"
version = "0.0.0"
description = "Native CAD adapter interface and stubs (ADR-003, ADR-004)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "c2b-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_configs = true
