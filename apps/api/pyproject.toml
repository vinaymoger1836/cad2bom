[project]
name = "c2b-api"
version = "0.0.0"
description = "CAD-to-BoM HTTP API: jobs, uploads, SSE"
requires-python = ">=3.12,<3.13"
dependencies = [
  "c2b-domain",
  "c2b-jobs",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c2b_api"]

[tool.mypy]
python_version = "3.12"
platform = "linux"  # the code runs in Linux containers
mypy_path = "src"
plugins = ["pydantic.mypy"]
