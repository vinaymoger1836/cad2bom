# Production overlay. Use together with the base file:
#   docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d --build --wait
# (scripts/deploy.sh does this.) It adds: the public domain with automatic HTTPS, log rotation,
# the production environment (no /docs, no /openapi.json), and a restart policy for every service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  init:
    logging: *logging
  postgres:
    logging: *logging
    # Not published on any host port; only the backend network reaches it.
  api:
    logging: *logging
    environment:
      C2B_ENV: production
  worker:
    logging: *logging
    environment:
      C2B_ENV: production
  cad-worker:
    logging: *logging
  caddy:
    logging: *logging
    ports: !override
      - "80:80"        # answers the certificate challenge and redirects to HTTPS
      - "443:443"
    # Caddy runs as a normal user with every capability dropped, so let it bind ports below 1024
    # inside its own network namespace only.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    environment:
      - C2B_DOMAIN
      - C2B_ACME_EMAIL
      - C2B_ADMIN_BASIC_USER
      - C2B_ADMIN_BASIC_HASH
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      # Certificates must survive restarts, or Let's Encrypt rate limits bite.
      - c2b-caddy:/data
    tmpfs: !override
      - /config
      - /tmp

volumes:
  c2b-caddy: {}
