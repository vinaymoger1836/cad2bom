# CAD-to-BoM stack. Run from the repository root:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build --wait
# (`make up` does this and creates .env on first use.)

name: cad2bom

x-app-user: &app-user "${C2B_UID:-1000}:${C2B_GID:-1000}"

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-limits-env: &limits-env
  C2B_DATA_DIR: /data
  C2B_MAX_CAD_MB: ${C2B_MAX_CAD_MB:-200}
  C2B_MAX_OTHER_MB: ${C2B_MAX_OTHER_MB:-25}
  C2B_MAX_FILES_PER_JOB: ${C2B_MAX_FILES_PER_JOB:-50}
  C2B_CAD_TIMEOUT_S: ${C2B_CAD_TIMEOUT_S:-120}
  C2B_CAD_SOCKET: /run/c2b/cad.sock
  C2B_LIBRARY_DIR: /app/library
  C2B_ENV: ${C2B_ENV:-development}

# Native conversion through Autodesk (ADR-018). Off unless APS_CLIENT_ID and APS_CLIENT_SECRET are
# set. Passed to the api (which decides whether native files are accepted) and the worker (which
# calls Autodesk). `C2B_APS_MODE` is live | replay | record; replay is for the B7 golden check.
x-native-env: &native-env
  APS_CLIENT_ID: ${APS_CLIENT_ID:-}
  APS_CLIENT_SECRET: ${APS_CLIENT_SECRET:-}
  C2B_APS_MONTHLY_CAP: ${C2B_APS_MONTHLY_CAP:-20}
  C2B_APS_MODE: ${C2B_APS_MODE:-live}
  C2B_APS_FIXTURE_DIR: /app/aps-fixtures
  C2B_APS_TIMEOUT_S: ${C2B_APS_TIMEOUT_S:-600}

# LLM provider keys (from .env, never baked into images). Empty = no live calls; recorded cassettes
# still replay. Passed only to services that use the router.
x-llm-env: &llm-env
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}

services:
  # One-shot: makes data/ and the cad socket volume writable by the app user, then exits.
  init:
    image: busybox:1.37
    user: "0:0"
    network_mode: none
    restart: "no"
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    command:
      - sh
      - -c
      - >-
        mkdir -p /data/jobs /data/out /data/converted /data/library &&
        (chown ${C2B_UID:-1000}:${C2B_GID:-1000} /data /data/jobs /data/out /data/converted /data/library || true) &&
        chmod 750 /data /data/jobs /data/out /data/converted /data/library &&
        chown ${C2B_UID:-1000}:${C2B_GID:-1000} /run/c2b &&
        chmod 770 /run/c2b
    volumes:
      - ../data:/data
      - c2b-cadsock:/run/c2b

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-c2b}
      POSTGRES_DB: ${POSTGRES_DB:-c2b}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run `make env` to create .env}
    volumes:
      - c2b-pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: c2b/api:dev
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    <<: *hardening
    user: *app-user
    environment:
      <<: [*limits-env, *llm-env, *native-env]
      C2B_DATABASE_URL: postgresql://${POSTGRES_USER:-c2b}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-c2b}
      # Admin page (ADR-020): off unless a passcode is set. Rate limits and retention (ADR-021/022).
      C2B_ADMIN_PASSCODE: ${C2B_ADMIN_PASSCODE:-}
      C2B_ADMIN_SECRET: ${C2B_ADMIN_SECRET:-}
      C2B_METRICS_TOKEN: ${C2B_METRICS_TOKEN:-}
      C2B_RETENTION_DAYS: ${C2B_RETENTION_DAYS:-30}
      C2B_RATE_JOB_CREATE_PER_MIN: ${C2B_RATE_JOB_CREATE_PER_MIN:-20}
      C2B_RATE_UPLOAD_PER_MIN: ${C2B_RATE_UPLOAD_PER_MIN:-120}
      C2B_RATE_GENERAL_PER_MIN: ${C2B_RATE_GENERAL_PER_MIN:-600}
      C2B_RATE_ADMIN_LOGIN_PER_MIN: ${C2B_RATE_ADMIN_LOGIN_PER_MIN:-5}
    volumes:
      - ../data:/data
    tmpfs:
      - /tmp
    networks: [edge, backend]
    depends_on:
      init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}

  worker:
    image: c2b/worker:dev
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    <<: *hardening
    user: *app-user
    environment:
      <<: [*limits-env, *llm-env, *native-env]
      C2B_DATABASE_URL: postgresql://${POSTGRES_USER:-c2b}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-c2b}
    volumes:
      - ../data:/data:ro
      # The one writable path: files Autodesk returns (converted STEP, OBJ). The cad-worker
      # reads them through its own read-only /data mount.
      - ../data/converted:/data/converted
      - c2b-cadsock:/run/c2b
    tmpfs:
      - /tmp
    networks: [backend]
    healthcheck:
      # A worker is healthy when it has sent a heartbeat to the queue in the last minute.
      test:
        - CMD
        - python
        - -c
        - >-
          import os, psycopg;
          c = psycopg.connect(os.environ['C2B_DATABASE_URL']);
          assert c.execute("SELECT 1 FROM procrastinate_workers
          WHERE last_heartbeat > now() - interval '90 seconds' LIMIT 1").fetchone()
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      api: {condition: service_healthy}
      cad-worker: {condition: service_healthy}

  # Sandbox for untrusted CAD files (ADR-003, ADR-012): no network at all, no database
  # credentials, read-only root, CPU/RAM/PID limits, 120 s per file enforced in the process.
  cad-worker:
    image: c2b/cad-worker:dev
    build:
      context: ..
      dockerfile: apps/cad-worker/Dockerfile
    <<: *hardening
    user: *app-user
    network_mode: none
    cpus: 2
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 256
    ulimits:
      nofile: {soft: 1024, hard: 1024}
    stop_grace_period: 10s
    environment:
      C2B_DATA_DIR: /data
      C2B_CAD_OUT_DIR: /out
      C2B_CAD_TIMEOUT_S: ${C2B_CAD_TIMEOUT_S:-120}
      C2B_CAD_SOCKET: /run/c2b/cad.sock
    volumes:
      - ../data:/data:ro        # input: read-only
      - ../data/out:/out        # results (GLB): the only writable path
      - c2b-cadsock:/run/c2b
    tmpfs:
      - /tmp:size=512m,mode=1777,noexec,nosuid
    depends_on:
      init: {condition: service_completed_successfully}

  caddy:
    image: c2b/caddy:dev
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    <<: *hardening
    user: *app-user
    ports:
      - "${C2B_HTTP_PORT:-8080}:8080"
    environment:
      # Reverse-proxy auth for /admin (see infra/Caddyfile). Unset = locked with a throwaway hash.
      - C2B_ADMIN_BASIC_USER
      - C2B_ADMIN_BASIC_HASH
    tmpfs:
      - /data
      - /config
      - /tmp
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  edge: {}
  backend: {}

volumes:
  c2b-pgdata: {}
  c2b-cadsock: {}
