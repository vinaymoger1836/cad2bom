  - { class: label.rating, min_count: 1, note: "Rating label" }
  - { class: documentation.manual, min_count: 1, note: "Instruction manual" }
  - { class: packaging.carton, min_count: 1, note: "Shipper carton" }
source: "Author's general knowledge of ceiling fans, not a catalogue or standard."
verify: true
