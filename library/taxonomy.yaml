# Class taxonomy (docs/06 §2). Code = family.group[.type], three levels at most.
# Fields not set on a class come from `defaults`. noun + modifiers feed the noun-first description
# (docs/04 §10); `description_template` placeholders must be listed in template_fields.
#   size        designated size incl. length for screws, e.g. M4x12; bore x OD x width for bearings
#   standard    standard designation, e.g. ISO 4762
#   grade       grade / property class text from the profile default or the user
#   dims        other key dimensions for custom parts, e.g. 120x40x2
# usually_modelled: false -> a user line with no CAD match is not flagged (docs/04 §7.2).
# buy_as_assembly: true -> the assembly becomes ONE buy line; children are notes (docs/04 §7.1).
# unspsc: optional 8-digit UNSPSC commodity code for purchasing systems (verify before use).
template_fields: [noun, modifiers, size, standard, grade, material, finish, dims, length, designation, rating, colour]
default_template: "{noun}, {modifiers}, {dims}, {material}"
defaults:
  uom: EA
  make_buy_default: buy
  usually_modelled: true
  buy_as_assembly: false

