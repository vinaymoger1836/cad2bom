# English name dictionary (docs/06 §5): tokens and phrases -> class, with a weight 0-1 that feeds the
# classification ladder step C4 (typical 0.5-0.8, docs/04 §5). Matching is case-folded.
# `context` (optional) restricts an entry, e.g. {parent_class_is: [electrical.motor]}; an entry
# with no context that shares a token with another class's entry is reported as a COLLISION.
