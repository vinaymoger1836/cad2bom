# Size and designation patterns plus vendor / CAD-library naming patterns (docs/06 §5).
# `yields` maps a name to a regex capture-group index. Each pattern carries an example that must
# match it (checked by `c2b-library validate`). Patterns are applied by the rules engine; they are
# data, never executed code.
lang: any
domain: patterns
patterns:
  - { id: metric_screw_length, regex: '(?i)\bM(\d+(?:[.,]\d+)?)\s*[x×*]\s*(\d+(?:[.,]\d+)?)\b', yields: { size: 1, length: 2 }, example: "M4x12" }
  - { id: metric_thread, regex: '(?i)\bM(\d+(?:[.,]\d+)?)\b', yields: { size: 1 }, example: "M4" }
  - { id: unified_numbered, regex: '#(\d{1,2})\s*-\s*(\d{2})\b', yields: { size: 1, tpi: 2 }, example: "#8-32" }
  - { id: unified_fraction, regex: '\b(\d{1,2}/\d{1,2})\s*-\s*(\d{1,2})\b', yields: { size: 1, tpi: 2 }, example: "1/4-20" }
  - { id: diameter, regex: '(?i)(?:Ø|⌀|dia\.?|diameter)\s*(\d+(?:[.,]\d+)?)', yields: { d: 1 }, example: "Ø6" }
  - { id: dims_xyz, regex: '(\d+(?:[.,]\d+)?)\s*[x×]\s*(\d+(?:[.,]\d+)?)(?:\s*[x×]\s*(\d+(?:[.,]\d+)?))?', yields: { a: 1, b: 2, c: 3 }, example: "500x120" }
  - { id: bearing_designation, regex: '\b(6[0-3]\d{2})(?:\s*-?\s*(?:2RSH?|2RS1|2Z|ZZ|RS|Z|C3))?\b', yields: { designation: 1 }, example: "6201-2RS" }
  - { id: oring_dims, regex: '(?i)\bo[- ]?ring\s*(\d+(?:[.,]\d+)?)\s*[x×]\s*(\d+(?:[.,]\d+)?)', yields: { d1: 1, d2: 2 }, example: "O-ring 20x2" }
  - { id: standard_designation, regex: '(?i)\b(ISO|DIN|EN|IS|ASME|ANSI|JIS)\s*-?\s*(\d{1,6}(?:-\d+)?)\b', yields: { body: 1, number: 2 }, example: "ISO 4762" }
  - { id: refdes_range, regex: '\b([A-Z]{1,3})(\d+)\s*[-–]\s*\1(\d+)\b', yields: { prefix: 1, first: 2, last: 3 }, example: "R1-R4" }
  - { id: refdes_single, regex: '\b([A-Z]{1,3})(\d+)\b', yields: { prefix: 1, number: 2 }, example: "C12" }
  - { id: dowel_diameter_length, regex: '(?i)\b(\d+(?:[.,]\d+)?)\s*(?:m6|h8)?\s*[x×]\s*(\d+(?:[.,]\d+)?)\b', yields: { d: 1, length: 2 }, example: "6x20" }
prefixes:
  - { vendor: mcmaster, regex: '^\d{4,5}[A-Z]\d{2,3}$', example: "91290A115", note: "McMaster-Carr part numbers: 4-5 digits, a letter, 2-3 digits. They identify catalogue parts; the description comes from the CAD property or the user." }
  - { vendor: misumi, regex: '^[A-Z]{3,6}\d{1,2}-\d{1,3}$', example: "SHCB6-20", note: "Misumi-style family code plus size (e.g. socket head cap bolt M6x20). Pattern is a guess from public catalogue examples; verify against your Misumi parts before relying on it." }
  - { vendor: solidworks_toolbox, regex: '(?i)^(.+?)_(?:AM|ISO|DIN|GB|JIS|BSI|CISC|KS|IS)\b', example: "Socket Head Cap Screw_ISO", note: "SolidWorks Toolbox appends a standard-body suffix to the part name. Pattern is from user-visible naming; verify against your Toolbox configuration." }
  - { vendor: fusion_mcmaster, regex: '(?i)^mcmaster[- _]?carr\b', example: "McMaster-Carr 91290A115", note: "Fusion inserts McMaster-Carr parts with the vendor name in the component name." }
