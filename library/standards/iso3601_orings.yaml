# Metric O-rings. d1 inside diameter, d2 cross-section. ISO 3601-1 defines the size series; the
# rows below are common metric catalogue sizes (not the complete ISO 3601 list). AS568 inch sizes
# are for a later version (docs/06 §4). Cross-section tolerance is wider than ID tolerance on
# purpose: modelled O-rings are often approximated.
standard: ISO 3601-1
key: ISO3601
aliases: [ISO 3601, DIN 3771, DIN3771, ISO 3601-1:2012]
family: o_ring_metric
class: seal.o_ring
edition: "2012"
tolerance_mm: { d1: 0.25, d2: 0.1 }
dims: [d1, d2]
group_by: d2
expected_sizes: ["10x1.5", "20x2", "20x2.5", "20x3", "30x2", "30x3", "50x3", "50x4"]
