# Plain washers with chamfer, normal series, product grade A. Same dimensions as ISO 7089; the
# chamfer on the outer edge of one side is the only difference (the recogniser cannot rely on it).
standard: ISO 7090
key: ISO7090
aliases: [DIN 125-B, EN ISO 7090]
family: plain_washer_normal_chamfered
class: fastener.washer.plain
edition: "2000"
tolerance_mm: { d1: 0.15, d2: 0.25, h: 0.1 }
dims: [d1, d2, h]
monotonic: [d2, h]
expected_sizes: [M2, M2.5, M3, M4, M5, M6, M8, M10, M12, M14, M16, M18, M20, M22, M24]
sizes:
  - { size: M2,   d1: 2.2,  d2: 5,  h: 0.3 }
  - { size: M2.5, d1: 2.7,  d2: 6,  h: 0.5 }
  - { size: M3,   d1: 3.2,  d2: 7,  h: 0.5 }
  - { size: M4,   d1: 4.3,  d2: 9,  h: 0.8 }
  - { size: M5,   d1: 5.3,  d2: 10, h: 1 }
  - { size: M6,   d1: 6.4,  d2: 12, h: 1.6 }
  - { size: M8,   d1: 8.4,  d2: 16, h: 1.6 }
  - { size: M10,  d1: 10.5, d2: 20, h: 2 }
  - { size: M12,  d1: 13,   d2: 24, h: 2.5 }
  - { size: M14,  d1: 15,   d2: 28, h: 2.5 }
  - { size: M16,  d1: 17,   d2: 30, h: 3 }
  - { size: M18,  d1: 19,   d2: 34, h: 3 }
  - { size: M20,  d1: 21,   d2: 37, h: 3 }
  - { size: M22,  d1: 23,   d2: 39, h: 3 }
