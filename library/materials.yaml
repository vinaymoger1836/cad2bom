# Materials (docs/06 §3). density_g_cm3 are typical handbook values rounded for BoM mass estimates
# (+-2% for metals, wider for plastics, woods and paper). Source text names the class of source;
# verify: true = entered from the author's knowledge, not checked against a datasheet for this app.
# Mass in the BoM is volume x this density (docs/04 §6); users can override per line.
families: [carbon_steel, alloy_steel, stainless_steel, aluminium, copper_alloy, zinc, magnesium, titanium, thermoplastic, thermoset, elastomer, wood, glass, paper, composite, other]
designation_systems: [en, is, astm, sae, jis, iso, trade]

