[project]
name = "cad2bom"
version = "0.0.0"
description = "CAD-to-BoM workspace root"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/domain",
  "packages/rules",
  "packages/jobs",
  "packages/library",
  "packages/agents",
  "packages/exports",
  "tools/fixtures",
  "apps/api",
  "apps/worker",
  "apps/cad-worker",
  "apps/native-adapter",
]

[tool.uv.sources]
c2b-domain = { workspace = true }
c2b-rules = { workspace = true }
c2b-jobs = { workspace = true }
c2b-library = { workspace = true }
c2b-agents = { workspace = true }
c2b-exports = { workspace = true }
c2b-fixtures = { workspace = true }
c2b-api = { workspace = true }
c2b-worker = { workspace = true }
c2b-cad-worker = { workspace = true }
c2b-native-adapter = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["node_modules", ".venv", "packages/ts-types"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["c2b_domain", "c2b_jobs", "c2b_library", "c2b_fixtures", "c2b_rules", "c2b_agents", "c2b_exports", "c2b_api", "c2b_worker", "c2b_cad_worker", "c2b_native_adapter"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S603", "S607", "S310", "S608", "E501", "E402", "E741", "B905"]
"tools/fixtures/*" = ["E501"]
# LLM prompt templates are long literal strings
"packages/agents/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
